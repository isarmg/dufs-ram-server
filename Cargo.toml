[package]
name = "dufs"
version = "0.51.4"
edition = "2024"
rust-version = "1.98"
description = "A Linux browser file manager"
authors = ["sigoden <sigoden@gmail.com>", "dufs developers"]
license = "Apache-2.0"
homepage = "https://github.com/isarmg/dufs-ram-server"
repository = "https://github.com/isarmg/dufs-ram-server"
publish = false
build = "build.rs"

[dependencies]
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
http = "1"
http-body = "1"
tower = { version = "0.5", features = ["util"] }
async-trait = "0.1"
sarmg-server-runtime = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a", version = "=0.7.6" }
sarmg-fs-safety = { git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a", version = "=0.7.6" }
clap = { version = "4.5", features = ["wrap_help"] }
chrono = { version = "0.4", default-features = false, features = ["clock"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "fs", "io-util", "signal", "net", "time"]}
tokio-util = { version = "0.7", default-features = false, features = ["rt"] }
percent-encoding = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
futures-util = { version = "0.3", default-features = false, features = ["alloc"] }
headers = "0.4"
mime_guess = "2.0"
uuid = { version = "1.7", features = ["v4"] }
log = { version = "0.4", features = ["std"] }
form_urlencoded = "1.2"
alphanumeric-sort = "1.4"
anyhow = "1.0"
rustix = { version = "1.1", features = ["event", "fs", "process", "time"] }
serde_yaml = { package = "serde_yaml_ng", version = "0.10" }
base64 = "0.22"
http-body-util = "0.1"
bytes = "1.5"
getrandom = "0.4"
rpassword = "7"
rusqlite = { version = "0.40.2", default-features = false, features = ["bundled"] }
sha2 = "0.11.0"
subtle = "2.6"
tempfile = "3"
sarmg-admin-auth = { version = "=0.7.6", git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a" }
sarmg-admin-core = { version = "=0.7.6", git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a" }
sarmg-admin-static = { version = "=0.7.6", git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a" }
sarmg-admin-axum = { version = "=0.7.6", git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a" }
sarmg-contracts = { version = "=0.7.6", git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a" }
sarmg-schema-identity = { version = "=0.7.6", git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a" }
sarmg-server-target = { version = "=0.7.6", git = "https://github.com/isarmg/sarmg-foundation-server.git", rev = "89eafaf171e409e6134fa669b140f615635baf5a" }

[dev-dependencies]
socket2 = "0.6"
assert_cmd = "2"
reqwest = { version = "0.13", features = ["blocking"], default-features = false }
assert_fs = "1"
indexmap = "2.2"
rstest = "0.26.1"
predicates = "3"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = "symbols"
